[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serum2vital"
version = "0.6.1"
description = "Convert Xfer Serum 1 (.fxp) and Serum 2 (.SerumPreset) presets into Vital (.vital) presets, wavetables and modulation included"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
keywords = ["serum", "vital", "synthesizer", "preset", "converter", "wavetable"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
dependencies = []

[project.optional-dependencies]
serum2 = ["zstandard", "cbor2"]
hosts = ["numpy", "pedalboard", "dawdreamer", "mido", "soundfile"]
dev = ["pytest", "zstandard", "cbor2", "numpy"]

[project.scripts]
serum2vital = "serum2vital.convert:main"

[project.urls]
Homepage = "https://github.com/btesser/serum2vital"
Issues = "https://github.com/btesser/serum2vital/issues"
Changelog = "https://github.com/btesser/serum2vital/blob/main/CHANGELOG.md"


[tool.setuptools]
packages = ["serum2vital"]

[tool.pytest.ini_options]
testpaths = ["tests"]
